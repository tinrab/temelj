name: Test

on:
  push:
    branches:
      - main
      - develop
      - feature/*

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm run build

      - name: Run lint
        run: |
          pnpm run format:check
          pnpm run lint

      - name: Check JSR packages
        run: |
          for package_dir in \
            packages/value \
            packages/async \
            packages/string \
            packages/color \
            packages/ffmpeg \
            packages/result \
            packages/standard-schema \
            packages/event \
            packages/log \
            packages/iterator \
            packages/math \
            packages/react-hooks \
            packages/id \
            packages/request \
            packages/env \
            packages/handlebars \
            packages/mdx \
            packages/mdx-react \
            packages/cache \
            packages/storage \
            lib
          do
            (cd "$package_dir" && npx jsr publish --dry-run --allow-dirty)
          done

      - name: Run tests
        run: pnpm run test
